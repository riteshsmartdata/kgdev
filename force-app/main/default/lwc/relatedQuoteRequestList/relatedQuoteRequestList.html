<template>
    <lightning-card class="custom-card">
        <div class="header">
            <lightning-icon icon-name="standard:quotes" size="small" class="logo" ></lightning-icon>
          <span lst-listviewmanagerheader_listviewmanagerheader="" class="slds-truncate slds-m-right--xx-small larger-text" title="Quote Products">
    <b>Quote Products</b>
</span>    
        </div>

        <div class="scroll-container">
            <template if:true={quoteRequests}>
                <div class="slds-grid slds-wrap">
                    <template for:each={quoteRequests} for:item="quoteRequest">
                        <div key={quoteRequest.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-1 slds-p-around_small">
                            <div class="slds-tile slds-tile_board">
                                <div class="slds-tile__title">
                                    <h3 class="slds-text-heading_small">
                                        <a href="javascript:void(0);" onclick={handleQuoteClick} data-quote-id={quoteRequest.Id}>
                                            {quoteRequest.Name}
                                        </a>
                                    </h3>
                                </div>
                                <div class="slds-tile__detail">
                                    <p>
                                        QuoteNumber:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                                        <a href="javascript:void(0);" onclick={handleQuoteClick} data-quote-id={quoteRequest.Id}>{quoteRequest.Quote_Number__c}</a>
                                    </p>
                   
                         <p>Quantity:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{quoteRequest.Quantity__c}</p>
                             <p>Products:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{quoteRequest.Products__r.Name}</p>
                                </div>

                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        
    </lightning-card>
</template>
