<template>

    <!-- Spinner added here -->
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-p-vertical_large">
            <lightning-spinner alternative-text="Loading" size="medium" variant="brand" ></lightning-spinner>
        </div>
    </template>

    <template if:true={tabelShowHide}>
        <lightning-card title="Related Cases for EBS Order " icon-name="standard:case">

            <p class="slds-text-body_small slds-p-horizontal_medium slds-p-bottom_xx-small slds-p-left_medium">
                {totalRecountCount} Items Sorted by: {sortByLabel}
            </p>

            <lightning-datatable key-field="Id" data={data} columns={columns} onsort={updateSort} sorted-by={sortedBy}
                sorted-direction={sortDir} hide-checkbox-column="true">
            </lightning-datatable>


            <!-- Centered Button Container with Scrollable Overflow -->
            <div class="slds-align_absolute-center slds-p-top_x-large">
                <div class="button-container">
                    <lightning-button class="button-style" label="Previous" icon-name="utility:chevronleft"
                        onclick={previousHandler} disabled={isPreviousDisable}>
                    </lightning-button>
                </div>

                <span class="slds-badge slds-badge_lightest" style="margin-right: 10px; margin-left: 10px;">
    Page {page} of {totalPage}.
</span>

                <div class="button-container">
                    <lightning-button class="button-style" label="Next" icon-name="utility:chevronright"
                        icon-position="right" onclick={nextHandler} disabled={isNextDisable}>
                    </lightning-button>
                </div>
            </div>


        </lightning-card>
    </template>

    <template if:false={tabelShowHide}>
        <div class="slds-align_absolute-center slds-p-vertical_large">
            <p class="slds-text-heading_medium slds-text-color_error">No records found.</p>
        </div>
    </template>

</template>
