<template>
    <lightning-card title={formattedTitle} icon-name="custom:custom63">
        <!-- Spinner added here -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_large">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand" ></lightning-spinner>
            </div>
        </template>

            <template if:true={dataTableShowHide}>
                <p class="slds-text-body_small slds-p-horizontal_medium slds-p-bottom_medium">{totalRecountCount} Item Sort
                    by: {sortByLabel}</p>
                <div style="overflow-x: auto; max-width: 100%;">
                    <lightning-datatable key-field="Id" data={emailMessages} columns={columns} onsort={updateSort}
                        sorted-by={sortBy} sorted-direction={sortDir} style="min-width: 600px;" hide-checkbox-column="true">
                    </lightning-datatable>
                </div>

                <div class="slds-align_absolute-center slds-p-top_medium">
                    <div class="button-container">
                        <lightning-button class="button-style" label="Previous" icon-name="utility:chevronleft"
                            onclick={previousHandler} disabled={isPreviousDisable}>
                        </lightning-button>
                    </div>

                    <span class="slds-badge slds-badge_lightest" style="margin-right: 10px; margin-left: 10px;">
                        Page {page} of {totalPage}.
                    </span>

                    <div class="button-container">
                        <lightning-button class="button-style" label="Next" icon-name="utility:chevronright"
                            icon-position="right" onclick={nextHandler} disabled={isNextDisable}>
                        </lightning-button>
                    </div>
                </div>
            </template>
            <template if:false={dataTableShowHide}>
                <div class="slds-align_absolute-center slds-p-vertical_large">
                    <p class="slds-text-heading_medium slds-text-color_error">No records found.</p>
                </div>
            </template>
    </lightning-card>
</template>
