<template>
	<lightning-card title="Sample Orders" icon-name="standard:orders">
		<div class="slds-m-around_medium">
			<div>
				<!-- Spinner starts -->
				<template if:true={isLoading}>
					<lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
				</template>
				<!-- Spinner ends -->
				<lightning-datatable key-field="Id" data={data} columns={columns} onsort={handleSort}
					sorted-by={sortedBy} sorted-direction={sortedDirection} hide-checkbox-column="true">
				</lightning-datatable>
			</div>
		</div>
		<!--  Pagination Buttons Start -->
		<div class="slds-align_absolute-center">
			<lightning-button label="Previous" icon-name="utility:chevronleft" onclick={previousHandler}
				disabled={isPreviousDisable}>
			</lightning-button>

			<span class="slds-badge slds-badge_lightest" style="margin-right: 10px;margin-left: 10px;">
                Displaying {startingRecord} to {endingRecord} of {totalRecountCount} records. Page {page} of {totalPage}.
            </span>

			<lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={nextHandler}
				disabled={isNextDisable}>
			</lightning-button>
		</div>
		<!--  Pagination Buttons End -->
	</lightning-card>
</template>
